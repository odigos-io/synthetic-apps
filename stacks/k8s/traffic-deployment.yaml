# Non-stop traffic — all 10 stacks-gateway transactions
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stacks-traffic
  namespace: stacks
  labels:
    app: stacks-traffic
spec:
  replicas: 10
  selector:
    matchLabels:
      app: stacks-traffic
  template:
    metadata:
      labels:
        app: stacks-traffic
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.4.0
          imagePullPolicy: IfNotPresent
          env:
            - name: TRAFFIC_DURATION_SECONDS
              value: "3600"
            - name: TRAFFIC_PARALLEL
              value: "6"
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              DURATION="${TRAFFIC_DURATION_SECONDS:-3600}"
              PARALLEL="${TRAFFIC_PARALLEL:-3}"
              GW="http://stacks-gateway:8080"
              TXNS="place-order sync-catalog fulfill-shipment publish-product apply-pricing sync-recommendations customer-lookup index-document ship-order platform-wide"

              echo "BOOM → stacks-gateway (10 transactions) pod=${HOSTNAME} duration=${DURATION}s"
              echo "Stop: make stop-traffic"

              end=$(( $(date +%s) + DURATION ))
              i=0
              while [ "$(date +%s)" -lt "$end" ]; do
                i=$((i + 1))
                p=1
                while [ "$p" -le "$PARALLEL" ]; do
                  key="${HOSTNAME}-${i}-${p}"
                  for txn in $TXNS; do
                    curl -sS -f -o /dev/null -X POST "${GW}/transactions/${txn}" \
                      -H "Content-Type: application/json" \
                      -d "{\"key\":\"${key}\",\"value\":\"${txn}-${i}\",\"userId\":\"user-1\",\"amount\":${i}.99}" &
                  done
                  p=$((p + 1))
                done
                wait
              done
              echo "BOOM finished pod=${HOSTNAME} loops=${i}"
