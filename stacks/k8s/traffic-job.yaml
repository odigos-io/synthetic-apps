# Burst traffic — 10 transactions on stacks-gateway
apiVersion: batch/v1
kind: Job
metadata:
  name: stacks-traffic
  namespace: stacks
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 1
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: curl
          image: curlimages/curl:8.4.0
          env:
            - name: TRAFFIC_ITERATIONS
              value: "1000"
            - name: TRAFFIC_WORKERS
              value: "20"
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              ITERATIONS="${TRAFFIC_ITERATIONS:-500}"
              WORKERS="${TRAFFIC_WORKERS:-10}"
              GW="http://stacks-gateway:8080"
              TXNS="place-order sync-catalog fulfill-shipment publish-product apply-pricing sync-recommendations customer-lookup index-document ship-order platform-wide"
              per_worker=$((ITERATIONS / WORKERS))
              remainder=$((ITERATIONS % WORKERS))
              echo "burst: ${ITERATIONS} x 10 transactions = $((ITERATIONS * 10)) requests"
              worker() {
                wid="$1" count="$2" wok=0 i=1
                while [ "$i" -le "$count" ]; do
                  key="${wid}-item-${i}"
                  for txn in $TXNS; do
                    curl -sS -f -o /dev/null -X POST "${GW}/transactions/${txn}" \
                      -H "Content-Type: application/json" \
                      -d "{\"key\":\"${key}\",\"value\":\"burst\",\"userId\":\"user-1\",\"amount\":${i}.99}" && wok=$((wok+1)) || true
                  done
                  i=$((i + 1))
                done
                echo "worker ${wid} ok=${wok}"
              }
              w=1
              while [ "$w" -le "$WORKERS" ]; do
                count=$per_worker; [ "$w" -le "$remainder" ] && count=$((count + 1))
                worker "$w" "$count" &
                w=$((w + 1))
              done
              wait
