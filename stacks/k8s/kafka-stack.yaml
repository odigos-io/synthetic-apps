# Kafka stack: 5 apps + Kafka broker (HTTP, Kafka, gRPC)
---
kind: Service
apiVersion: v1
metadata:
  name: kafka-broker
spec:
  selector:
    app: kafka-broker
  ports:
    - port: 9092
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: kafka-broker
spec:
  selector:
    matchLabels:
      app: kafka-broker
  template:
    metadata:
      labels:
        app: kafka-broker
    spec:
      containers:
        - name: kafka
          image: docker.io/apache/kafka:3.9.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9092
            - containerPort: 9093
          env:
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka-broker:9092"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@localhost:9093"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
              value: "0"
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 18
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: processor-java
spec:
  selector:
    matchLabels:
      app: processor-java
  template:
    metadata:
      labels:
        app: processor-java
    spec:
      containers:
        - name: processor-java
          image: ghcr.io/odigos-io/synthetic-apps/stacks-kafka-processor-java:stacks
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_BROKERS
              value: kafka-broker:9092
            - name: KAFKA_TOPIC
              value: stacks-events
            - name: ANALYTICS_URL
              value: http://analytics-python:8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 25
---
kind: Service
apiVersion: v1
metadata:
  name: processor-java
spec:
  selector:
    app: processor-java
  ports:
    - port: 8080
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: inventory-go
spec:
  selector:
    matchLabels:
      app: inventory-go
  template:
    metadata:
      labels:
        app: inventory-go
    spec:
      containers:
        - name: inventory-go
          image: ghcr.io/odigos-io/synthetic-apps/stacks-kafka-inventory-go:stacks
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
            - containerPort: 50051
          env:
            - name: KAFKA_BROKERS
              value: kafka-broker:9092
            - name: KAFKA_TOPIC
              value: stacks-events
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
---
kind: Service
apiVersion: v1
metadata:
  name: inventory-go
spec:
  selector:
    app: inventory-go
  ports:
    - name: http
      port: 8080
    - name: grpc
      port: 50051
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: analytics-python
spec:
  selector:
    matchLabels:
      app: analytics-python
  template:
    metadata:
      labels:
        app: analytics-python
    spec:
      containers:
        - name: analytics-python
          image: ghcr.io/odigos-io/synthetic-apps/stacks-kafka-analytics-python:stacks
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_BROKERS
              value: kafka-broker:9092
            - name: KAFKA_TOPIC
              value: stacks-events
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
---
kind: Service
apiVersion: v1
metadata:
  name: analytics-python
spec:
  selector:
    app: analytics-python
  ports:
    - port: 8080
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: relay-nodejs
spec:
  selector:
    matchLabels:
      app: relay-nodejs
  template:
    metadata:
      labels:
        app: relay-nodejs
    spec:
      containers:
        - name: relay-nodejs
          image: ghcr.io/odigos-io/synthetic-apps/stacks-kafka-relay-nodejs:stacks
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: KAFKA_BROKERS
              value: kafka-broker:9092
            - name: KAFKA_TOPIC
              value: stacks-events
            - name: PROCESSOR_URL
              value: http://processor-java:8080
            - name: STARTUP_DELAY_MS
              value: '12000'
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
---
kind: Service
apiVersion: v1
metadata:
  name: relay-nodejs
spec:
  selector:
    app: relay-nodejs
  ports:
    - port: 8080
