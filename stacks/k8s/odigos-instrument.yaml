# Unified gateway (single entry point for all 3 transactions)
apiVersion: odigos.io/v1alpha1
kind: Source
metadata:
  name: instrument-stacks-gateway
  namespace: stacks
spec:
  workload:
    kind: Deployment
    name: stacks-gateway
    namespace: stacks
---
# Redis stack (4 apps — worker consumes async from notifier)
apiVersion: odigos.io/v1alpha1
kind: Source
metadata:
  name: instrument-session-python
  namespace: stacks-redis
spec:
  workload:
    kind: Deployment
    name: session-python
    namespace: stacks-redis
