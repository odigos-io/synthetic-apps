apiVersion: v1
kind: ConfigMap
metadata:
  name: mtls-otlp-receiver-config
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
            tls:
              cert_file: /certs/server.crt
              key_file: /certs/server.key
              client_ca_file: /certs/ca.crt
    processors:
      batch: {}
    exporters:
      debug:
        verbosity: detailed
    service:
      telemetry:
        logs:
          level: info
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mtls-otlp-receiver
  labels:
    app: mtls-otlp-receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mtls-otlp-receiver
  template:
    metadata:
      labels:
        app: mtls-otlp-receiver
    spec:
      containers:
        - name: otelcol
          image: otel/opentelemetry-collector-contrib:0.120.0
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
            - name: certs
              mountPath: /certs
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: 4317
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: mtls-otlp-receiver-config
        - name: certs
          secret:
            secretName: mtls-otlp-receiver-certs
---
apiVersion: v1
kind: Service
metadata:
  name: mtls-otlp-receiver
spec:
  selector:
    app: mtls-otlp-receiver
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
