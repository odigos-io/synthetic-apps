# Baseline traffic: normal, well-shaped calls so Insights learns the argument
# profiles for getUser (numeric id) and checkRole (user/admin/guest enum).
# Trigger with: make trigger-baseline (from java/custom-instrumentation-args)
apiVersion: batch/v1
kind: Job
metadata:
  name: custom-instrumentation-args-baseline
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: custom-instrumentation-args-baseline
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      containers:
        - name: curl
          image: curlimages/curl:8.4.0
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              BASE_URL="http://custom-instrumentation-args:8080"
              ROLES="user admin guest"
              # Enough well-shaped calls to satisfy the default promotion bar
              # (baseline unchanged for 300 observations).
              i=1
              while [ "$i" -le 400 ]; do
                curl -sS -f "$${BASE_URL}/user?id=$${i}" >/dev/null
                for r in $$ROLES; do
                  curl -sS -f "$${BASE_URL}/authorize?role=$${r}" >/dev/null
                done
                i=$$((i + 1))
              done
              echo "baseline traffic complete (400 getUser + 1200 checkRole calls)"
