server.port=8080
spring.application.name=sql-query
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:sql_query}
spring.datasource.username=${PGUSER:app}
spring.datasource.password=${PGPASSWORD:app}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
# Allow startup while postgres is still coming up; SchemaService retries schema init.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=5000
