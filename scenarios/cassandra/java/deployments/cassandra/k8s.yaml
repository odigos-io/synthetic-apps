kind: Deployment
apiVersion: apps/v1
metadata:
  name: cassandra-db
  labels:
    app: cassandra-db
    odigos.io/test-infra: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cassandra-db
  template:
    metadata:
      labels:
        app: cassandra-db
        # Skip instrumentation wait — cassandra-db is not an Odigos Source.
        odigos.io/test-infra: "true"
    spec:
      containers:
        - name: cassandra-db
          image: cassandra:4.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9042
          env:
            - name: MAX_HEAP_SIZE
              value: 256M
            - name: HEAP_NEWSIZE
              value: 64M
            - name: CASSANDRA_CLUSTER_NAME
              value: TestCluster
            - name: CASSANDRA_DC
              value: datacenter1
            - name: CASSANDRA_ENDPOINT_SNITCH
              value: GossipingPropertyFileSnitch
          resources:
            requests:
              memory: 1Gi
            limits:
              memory: 2Gi
          readinessProbe:
            tcpSocket:
              port: 9042
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: 9042
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
---
kind: Service
apiVersion: v1
metadata:
  name: cassandra-db
  labels:
    odigos.io/test-infra: "true"
spec:
  selector:
    app: cassandra-db
  ports:
    - protocol: TCP
      port: 9042
---
kind: Deployment
apiVersion: apps/v1
metadata:
  name: cassandra
  labels:
    app: cassandra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cassandra
  template:
    metadata:
      labels:
        app: cassandra
    spec:
      containers:
        - name: cassandra
          image: p0xd21zf5r.registry.depot.dev/synthetic-apps:java-cassandra
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: CASSANDRA_HOST
              value: cassandra-db
            - name: CASSANDRA_PORT
              value: "9042"
            - name: CASSANDRA_DATACENTER
              value: datacenter1
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 5
---
kind: Service
apiVersion: v1
metadata:
  name: cassandra
spec:
  selector:
    app: cassandra
  ports:
    - protocol: TCP
      port: 8080
